name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The GitHub Action in action.yml, as other repositories use it.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./
        with:
          map: examples/todography
          args: --strict
      - uses: ./
        with:
          map: examples/todography
          command: build
          args: --out site/index.html
      - run: test -s site/index.html

  # Every merge to main is a minor release. Lives here rather than in its own
  # workflow so it inherits `needs: test` instead of re-running the suite.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two merges landing at once would both bump from the same base version.
    concurrency: release
    permissions:
      contents: write # push the bump commit, tag, and GitHub release
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-edit

      # Cargo reads the version from the checked-in file, so the bump has to be
      # a real commit on main; the tag alone would publish the previous version.
      - run: cargo set-version --bump minor
      - id: v
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0] | "v=\(.version)\nname=\(.name)"' >> "$GITHUB_OUTPUT"

      # Before the push, so a registry or trusted-publishing problem fails while
      # main is still untouched rather than after it has been bumped and tagged.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Each step below checks whether its artifact already exists, so re-running
      # a failed run resumes instead of colliding. The bump is deterministic
      # (checkout is pinned to the run's commit), so the tag's tree must match.
      - run: |
          if git fetch origin "refs/tags/v$V:refs/tags/v$V" 2>/dev/null; then
            git diff --quiet "v$V" || {
              echo "::error::v$V exists but its tree differs from this run's bump"
              exit 1
            }
            echo "v$V is already pushed; resuming from it"
            git reset --hard "v$V"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release $V"
            git tag -a "v$V" -m "v$V"
            # GITHUB_TOKEN pushes don't trigger workflows, so this doesn't loop.
            git push origin HEAD:main "v$V"
          fi
        env:
          V: ${{ steps.v.outputs.v }}

      # After the push: a failed publish leaves a tag with no crate, which a
      # re-run fixes. crates.io 403s curl's default User-Agent, hence the header.
      - run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "User-Agent: $NAME release workflow (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/$NAME/$V")
          case "$code" in
            200) echo "$NAME $V is already on crates.io" ;;
            404) cargo publish --locked ;;
            *)   echo "::error::crates.io returned $code for $NAME $V"; exit 1 ;;
          esac
        env:
          NAME: ${{ steps.v.outputs.name }}
          V: ${{ steps.v.outputs.v }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - run: gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --generate-notes
        env:
          V: ${{ steps.v.outputs.v }}
          GH_TOKEN: ${{ github.token }}

      # The tap's bump workflow also polls hourly; this just runs it now. The
      # token can only start workflows on the tap, not push to it.
      - run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TAP_DISPATCH_TOKEN not set; the tap will catch up on its hourly poll"
            exit 0
          fi
          gh workflow run bump.yml -R mkmik/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
