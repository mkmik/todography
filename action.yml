name: todography
description: Lint a todography map, or build its interactive page
author: mkmik
branding:
  icon: map
  color: blue

inputs:
  command:
    description: The todography command to run, such as lint or build
    default: lint
  args:
    description: Arguments after the command, such as --strict or --out site/index.html
    default: ""
  map:
    description: The map directory or the workspace root above docs/map; found from the working directory when empty
    default: ""

runs:
  using: composite
  steps:
    # The action builds the todography next to it, so its version is the ref
    # the caller pinned. Keyed on the source, since a branch ref moves.
    - id: key
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        echo "key=todography-$RUNNER_OS-$RUNNER_ARCH-$(cat Cargo.lock Cargo.toml $(find src -type f | sort) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/todography
        key: ${{ steps.key.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked --path "$GITHUB_ACTION_PATH" --root "$RUNNER_TEMP/todography"
    - shell: bash
      run: |
        # So later steps can run todography themselves.
        echo "$RUNNER_TEMP/todography/bin" >> "$GITHUB_PATH"
        echo "::add-matcher::$GITHUB_ACTION_PATH/.github/todography-matcher.json"
        # $ARGS is unquoted on purpose: it holds several words.
        "$RUNNER_TEMP/todography/bin/todography" ${MAP:+--map "$MAP"} "$COMMAND" $ARGS
      env:
        COMMAND: ${{ inputs.command }}
        ARGS: ${{ inputs.args }}
        MAP: ${{ inputs.map }}
